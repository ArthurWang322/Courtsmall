[package]
name = "courtsmall"
version = "0.3.0"
description = "Basketball, but small. Unofficial desktop companion for following live NBA games."
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "courtsmall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
