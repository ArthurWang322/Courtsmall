# Every push to main and every pull request: types and tests. Tests that need recorded games skip
# here: those recordings are never committed (scripts/probe/06-fixtures.mjs makes them locally).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The lock file was made with --legacy-peer-deps (npm 10 could not resolve vitest's peers).
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
